<h1 class="mb-4 text-2xl font-semibold">Dashboard</h1>

<p class="text-muted-foreground">Welcome to iErp. Use the menu to open a screen.</p>

@if (quickLinks.length > 0) {
  <h2 class="mb-2 mt-8 text-lg font-semibold">Quick links</h2>
  <ul class="quick-links flex flex-wrap gap-4">
    @for (link of quickLinks; track link.route) {
      <li>
        <a hlmBtn variant="outline" [routerLink]="link.route">
          <ng-icon [name]="link.icon" aria-hidden="true" />
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
}
